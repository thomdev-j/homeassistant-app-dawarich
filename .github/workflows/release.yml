name: Publish release

on:
  push:
    branches: [main]
    paths:
      - "dawarich/config.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to the one in config.yaml)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(grep -m1 '^version:' dawarich/config.yaml | sed 's/version: *"\(.*\)"/\1/')}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version"
            exit 1
          fi
          # The addon version is "<upstream>-<addon revision>"; the upstream part
          # tells users which Dawarich release this packages.
          UPSTREAM="${VERSION%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (packages Dawarich $UPSTREAM)"

      # Version bumps are not the only thing that touches config.yaml, and the
      # workflow can be re-run by hand, so an existing tag means we are done.
      - name: Skip if already released
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists — nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything between "## <version>" and the next "## " heading.
          NOTES=$(awk -v ver="## $VERSION" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' dawarich/CHANGELOG.md | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -z "$NOTES" ]; then
            echo "::error::No changelog section found for $VERSION in dawarich/CHANGELOG.md"
            exit 1
          fi

          echo "Release notes:"
          echo "$NOTES"

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "$(cat <<EOF
          $NOTES

          ---

          Packages [Dawarich $UPSTREAM](https://github.com/Freika/dawarich/releases/tag/$UPSTREAM).
          Install or update through the Home Assistant app store; the Supervisor picks this up automatically.
          EOF
          )"

          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
